name: AI Coding Agent

on:
  # Manual trigger only. A maintainer must explicitly choose to run the agent
  # on a specific issue, which means they've read the issue body first.
  # This prevents prompt-injection attacks where a malicious issue body could
  # hijack an automatically triggered agent.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to work on
        required: true
        type: number

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Minimal token permissions — only what the agent actually needs.
permissions:
  contents: write        # create branch + push commits
  pull-requests: write   # open the draft PR
  issues: write          # post progress comments

jobs:
  solve:
    name: Solve issue #${{ inputs.issue_number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Comment — agent starting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --body "🤖 Agent is starting. It will post progress updates directly on this issue."

      - name: Run coding agent
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.8"
          verb: call
          # Dagger reads GH_TOKEN from the environment and treats it as a secret
          # (never logged). ANTHROPIC_API_KEY selects the LLM provider;
          # swap for OPENAI_* vars to use a different model.
          args: >-
            solve
            --issue-number=${{ inputs.issue_number }}
            --repo=${{ github.repository }}
            --gh-token=env:GH_TOKEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment — unexpected failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --body "❌ Agent run failed unexpectedly before it could post an update. Check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
