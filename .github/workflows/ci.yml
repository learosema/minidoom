name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Renderer gap tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.8"
          verb: call
          args: test --source=.

  review:
    name: AI code review
    runs-on: ubuntu-latest
    # Only run on PRs and only when the secret is present.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.20.8"
          verb: call
          args: review --source=./src
        env:
          # Set ANTHROPIC_API_KEY in repo Settings → Secrets to enable Claude reviews.
          # Swap for OPENAI_BASE_URL + OPENAI_MODEL to use any OpenAI-compatible model.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
